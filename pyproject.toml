[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "section_core"
version = "0.1.0"
description = "Core structural section package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "section_core contributors" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
